name: Keep Supabase awake

# Free-tier Supabase projects pause after a stretch of inactivity, and a paused
# project's hostname stops resolving — which silently breaks Google sign-in
# (and all cloud saving) until someone restores it by hand. This runs a real
# database query once a day so the project stays active.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::Missing SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secrets"
            exit 1
          fi

          # A real read against a table: this is database activity, which is
          # what resets the inactivity timer.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -m 45 \
            "${SUPABASE_URL}/rest/v1/books?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "HTTP ${code}"
          head -c 400 /tmp/body || true
          echo

          if [ "${code}" != "200" ] && [ "${code}" != "206" ]; then
            echo "::error::Supabase ping failed with HTTP ${code} — the project may be paused or unreachable."
            exit 1
          fi
          echo "Supabase is awake."
