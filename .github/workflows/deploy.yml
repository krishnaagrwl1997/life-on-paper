name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_ZwqcatAquvcaHPsyfe2pINuD
  VERCEL_PROJECT_ID: prj_ePUg3nGNY7fCfTkCX6NtxBGkX294

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment information
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: |
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set production alias to lifeonpaper.app
        run: |
          npx vercel alias set ${{ steps.deploy.outputs.url }} lifeonpaper.app \
            --token=${{ secrets.VERCEL_TOKEN }}
