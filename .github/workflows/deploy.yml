name: Deploy to Vercel

# Deploys production via the Vercel REST API (no Vercel CLI, no login scopes).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_ZwqcatAquvcaHPsyfe2pINuD
  VERCEL_PROJECT_ID: prj_ePUg3nGNY7fCfTkCX6NtxBGkX294
  VERCEL_REPO_ID: "1348203015"

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Create production deployment from GitHub
        id: create
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"life-on-paper\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":${VERCEL_REPO_ID},\"ref\":\"${GITHUB_REF_NAME}\"}}")
          echo "$response" | head -c 2000
          id=$(echo "$response" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          url=$(echo "$response" | python3 -c "import sys,json;print(json.load(sys.stdin).get('url',''))")
          if [ -z "$id" ]; then echo "::error::Vercel did not return a deployment id"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment queued: $id ($url)"

      - name: Wait for the deployment to finish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          id="${{ steps.create.outputs.id }}"
          for i in $(seq 1 60); do
            state=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_ORG_ID}" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('readyState',''))")
            echo "[$i] $state"
            case "$state" in
              READY) exit 0 ;;
              ERROR|CANCELED) echo "::error::Deployment finished with state $state"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the deployment"; exit 1

      - name: Deployment summary
        run: |
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: https://${{ steps.create.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live: https://lifeonpaper.app" >> "$GITHUB_STEP_SUMMARY"
