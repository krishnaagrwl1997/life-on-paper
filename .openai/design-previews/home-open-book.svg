<text x="630" y="120" font-family="Georgia" font-size="23" font-weight="700" fill="#2b2620">Life on Paper</text><text x="630" y="143" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1.5" fill="#786e63">YOUR LIFE, ONE PAGE AT A TIME</text>
<rect x="858" y="99" width="112" height="38" rx="4" fill="#fffcf6" stroke="#d9ccba"/><text x="871" y="122" font-family="Georgia" font-size="15" fill="#b58a3a">✦</text><text x="893" y="115" font-family="Arial" font-size="9" fill="#63594f">A note from</text><text x="893" y="127" font-family="Arial" font-size="9" fill="#63594f">your life</text>
<text x="626" y="177" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1.7" fill="#786e63">BOOK ONE · VOLUME II</text><text x="918" y="177" font-family="Arial" font-size="9" font-weight="700" fill="#b58a3a">6 PAGES</text>
<g filter="url(#b)"><rect x="622" y="192" width="356" height="490" rx="5" fill="#fffcf6" stroke="#d8cab9"/></g><rect x="795" y="192" width="10" height="490" fill="#eadfce"/><line x1="800" y1="192" x2="800" y2="682" stroke="#cdbda8"/>
<text x="642" y="228" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1.5" fill="#786e63">YOUR BOOK</text><text x="642" y="296" font-family="Georgia" font-size="42" font-weight="700" fill="#2b2620">Summer</text><text x="642" y="339" font-family="Georgia" font-size="42" font-weight="700" fill="#2b2620">of Firsts</text>
<text x="642" y="377" font-family="Georgia" font-size="14" fill="#776d62">A life assembled from</text><text x="642" y="398" font-family="Georgia" font-size="14" fill="#776d62">the moments worth keeping.</text><line x1="642" y1="626" x2="695" y2="626" stroke="#b58a3a"/><text x="642" y="648" font-family="Arial" font-size="8" font-weight="700" letter-spacing="1.3" fill="#786e63">KRISHNA · 2026</text>
<text x="824" y="228" font-family="Arial" font-size="8" font-weight="700" letter-spacing="1.4" fill="#c1592b">LATEST PAGE · BECOMING</text><text x="824" y="272" font-family="Georgia" font-size="26" font-weight="700" fill="#2b2620">The Patience</text><text x="824" y="302" font-family="Georgia" font-size="26" font-weight="700" fill="#2b2620">Someone Else</text><text x="824" y="332" font-family="Georgia" font-size="26" font-weight="700" fill="#2b2620">Noticed</text>
<text x="824" y="372" font-family="Georgia" font-size="13" fill="#51483f">It was such a small thing to be</text><text x="824" y="393" font-family="Georgia" font-size="13" fill="#51483f">seen for—the pause before</text><text x="824" y="414" font-family="Georgia" font-size="13" fill="#51483f">answering, the choice to stay gentle.</text>
<rect x="824" y="466" width="132" height="42" rx="3" fill="none" stroke="#2b2620"/><text x="839" y="492" font-family="Arial" font-size="10" font-weight="700" fill="#2b2620">CONTINUE READING</text><text x="910" y="545" font-family="Georgia" font-size="13" fill="#776d62">Page 38</text>
<rect x="844" y="616" width="112" height="43" rx="3" fill="#c1592b"/><text x="860" y="644" font-family="Arial" font-size="11" font-weight="700" fill="white">＋ Add Memory</text>
<text x="626" y="724" font-family="Georgia" font-size="20" font-weight="700" fill="#2b2620">Chapters</text><line x1="626" y1="742" x2="974" y2="742" stroke="#d9ccba"/><text x="630" y="776" font-family="Georgia" font-size="12" fill="#b58a3a">I</text><text x="660" y="776" font-family="Georgia" font-size="18" fill="#2b2620">Becoming</text><text x="930" y="776" font-family="Arial" font-size="9" fill="#776d62">3 pages</text><line x1="626" y1="796" x2="974" y2="796" stroke="#d9ccba"/><text x="630" y="830" font-family="Georgia" font-size="12" fill="#b58a3a">II</text><text x="660" y="830" font-family="Georgia" font-size="18" fill="#2b2620">People Who Changed Me</text>
<rect x="605" y="850" width="390" height="72" fill="#302b25"/><text x="638" y="890" font-family="Arial" font-size="18" fill="#f7f1e7">⌂</text><text x="709" y="890" font-family="Arial" font-size="17" fill="#c9beb1">▥</text><rect x="774" y="856" width="52" height="52" rx="5" fill="#c1592b"/><text x="792" y="891" font-family="Arial" font-size="28" fill="white">＋</text><text x="867" y="890" font-family="Arial" font-size="18" fill="#c9beb1">♧</text><text x="939" y="890" font-family="Arial" font-size="18" fill="#c9beb1">○</text>
<text x="612" y="952" font-family="Arial" font-size="14" fill="#786e63">A physical book is the home. Everything starts from the spread.</text></svg>
