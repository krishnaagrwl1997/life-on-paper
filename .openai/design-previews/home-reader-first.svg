<text x="627" y="116" font-family="Georgia" font-size="21" font-weight="700" fill="#2b2620">Life on Paper</text><text x="627" y="139" font-family="Arial" font-size="10" fill="#776d62">Your life, one page at a time</text><rect x="852" y="98" width="120" height="42" rx="4" fill="#fcf9f2" stroke="#cbbdae"/><rect x="864" y="108" width="18" height="23" fill="#fffdf8" stroke="#2b2620"/><circle cx="882" cy="108" r="3" fill="#b89043"/><text x="892" y="114" font-family="Arial" font-size="9" fill="#2b2620">A note from</text><text x="892" y="126" font-family="Arial" font-size="9" fill="#2b2620">your life</text>
<text x="627" y="177" font-family="Arial" font-size="9" font-weight="700" letter-spacing="1.6" fill="#776d62">YOUR BOOK</text><text x="826" y="177" font-family="Georgia" font-size="16" font-weight="700" fill="#2b2620">Summer of Firsts</text>
