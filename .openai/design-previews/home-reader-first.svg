<text x="646" y="430" font-family="Georgia" font-size="54" font-weight="700" fill="#c1592b">I</text><text x="678" y="409" font-family="Georgia" font-size="16" fill="#40372e">t was such a small thing to be seen for.</text><text x="678" y="435" font-family="Georgia" font-size="16" fill="#40372e">I had almost missed it myself—the pause</text><text x="646" y="461" font-family="Georgia" font-size="16" fill="#40372e">before answering, the choice to stay gentle.</text><text x="646" y="487" font-family="Georgia" font-size="16" fill="#40372e">But someone else noticed, and for a moment</text><text x="646" y="513" font-family="Georgia" font-size="16" fill="#40372e">I met the quieter person I was becoming.</text>
<line x1="646" y1="561" x2="954" y2="561" stroke="#dccfc0"/><text x="646" y="590" font-family="Arial" font-size="10" font-weight="700" fill="#2b2620">CONTINUE READING</text><text x="752" y="590" font-family="Arial" font-size="15" fill="#c1592b">→</text><text x="874" y="590" font-family="Arial" font-size="9" fill="#776d62">PAGE 38  ━━━</text>
